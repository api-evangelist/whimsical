  description: >-
    Limited-beta REST API. Endpoints are read-oriented and use POST verbs: `users.get`, `teams.list`,
    `comments.list`, `files.list`, `files.get`. Authentication is OAuth 2.1, with credentials issued by
    Whimsical support to approved beta participants.
